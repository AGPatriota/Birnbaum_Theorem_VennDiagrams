version: v0.4
project:
  name: 'Birnbaum’s principles in Venn diagrams: Extended version with Lean verification'
  description: >-
    We reformulate Birnbaum's theorem as a statement about classes of statistical procedures
    that preserve statistical relations, and show that the proof reduces to the propagation
    of evidential equality along chains of conditionality-related inference bases (experiment–observation
    pairs). For finite parameter spaces with at least two points, the sufficiency relation and
    the conditionality relation are incomparable, yet the corresponding preservation classes
    are nested. The class of likelihood-invariant procedures with codomain [0, 1] is strictly
    contained in the class of sufficiency-invariant procedures. The lower-tail likelihood-ratio
    p-value illustrates this strict inclusion.
  authors:
  - Jaime Enrique Lincovil Curivil
  - Alexandre Galvão Patriota
  license: Apache-2.0
  responsible_maintainers:
  - Alexandre Galvão Patriota
classification:
  arxiv:
  - math.ST
  msc2020:
  - 62A01
  - 62B05
sources:
- title: 'Birnbaum’s principles in Venn diagrams: Extended version with Lean verification'
  authors:
  - Jaime Enrique Lincovil Curivil
  - Alexandre Galvão Patriota
  type: paper
  relationship: formalizes
  id: >-
    Lincovil Curivil, J. E., and Patriota, A. G. (2026). Birnbaum's principles in Venn diagrams:
    Extended version with Lean verification.
  location: Theorem 3.1; Corollary 3.1 and Corollary 3.2; Example 3.7; Appendix A.
  note: >-
    The correspondence with the manuscript was checked by the authors. The paper will be uploaded 
    to ArXiv after the Palomar certification
- title: What does the proof of Birnbaum’s theorem prove?
  authors:
  - Evans, M.
  type: paper
  relationship: adapts
  id: https://doi.org/10.1214/13-EJS857
  location: Electronic Journal of Statistics, 7, 2645–2655. Lemmas 1–6, Theorems 7–9, and Corollary
    10.
  note: >-
    The statistical results are proved from our definitions of L, S, and C in the finite setting,
    under the stated assumptions.

- title: On the foundations of statistical inference
  authors:
  - Birnbaum, A.
  type: paper
  relationship: background
  id: https://doi.org/10.1080/01621459.1962.10480660
  location: Journal of the American Statistical Association, 57(298), 269–306 (1962).
  note: >-
    Birnbaum (1962) formalized the likelihood, sufficiency, and conditionality
    principles and established that the sufficiency and conditionality
    principles jointly imply, and are implied by, the likelihood principle.
    Our development uses Evans' (2013) relational framework to reformulate
    this equivalence as a statement about classes of statistical procedures,
    for finite effective sample spaces and a common non-empty finite
    parameter space. The statistical results are proved from our definitions
    of L, S, and C under these assumptions.
status:
  scope: >-
    Finite effective sample spaces and a common non-empty finite parameter space. Theorem 3.1,
    Corollary 3.1 and Corollary 3.2, the finite closure argument, the Neyman–Fisher factorization,
    minimal sufficiency, incomparability, and the lower-tail likelihood-ratio p-value. The Lean
    development also certifies counterparts of ten numbered results of Evans (2013); Lemmas
    1-6, Theorems 7-9, and Corollary 10. The output set is allowed to be empty. The reduced stable 
    conditionality relation, maximum-likelihood set estimates, posterior probabilities, and 
    confidence-region constructions are not included in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Quot.sound
  - Classical.choice
automation:
  methods:
  - method: other
    models:
    - GPT-6 Astra
    tool_setup: formal proofs in Lean and cross-checking the manuscript against the formalization
  notes: >-
    The authors used GPT-6 Astra to assist with formal proofs in Lean and cross-checking the
    manuscript against the formalization. The correspondence with the manuscript was audited by the authors.
    The authors remain responsible for the article and its accompanying code.
fidelity:
  divergences: >-
    For the finite setting considered here, the definition makes explicit the conditionality
    relation used in the arguments of Evans (2013). In particular, the sample-space identifications
    that are implicit in Evans' formulation are stated explicitly in order to permit its
    formalization in Lean. The present framework is developed under the equivalence-based reading 
    consistent with Birnbaum (1962) and Evans (2013).
review:
  status: author-audited
  notes: >-
    The coverage records document the author-audited correspondence between the manuscript and
    the formal statements. The authors remain responsible for the article and its accompanying
    code.

